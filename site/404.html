    <style>
      @font-face {
        font-family: "Courier Prime";
        src: url("fonts/courier-prime-400.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        --desk: #e9e6e0;
        --paper: #ffffff;
        --ink: #1a1a1a;
        --fg: #1f1d1a;
        --fg-muted: #5a564f;
        --accent: #2450be;
        --on-accent: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --desk: #1f1d1a;
          --paper: #2a2826;
          --ink: #efece6;
          --fg: #efece6;
          --fg-muted: #b8b2a7;
          --accent: #8daeff;
          --on-accent: #121211;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: var(--desk);
        color: var(--fg);
        font-family:
          Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      main {
        width: min(100%, 30rem);
        background: var(--paper);
        color: var(--ink);
        padding: 2.5rem 2rem;
        box-shadow: 0 1px 3px rgb(31 29 26 / 0.18);
      }

      .script {
        font-family: "Courier Prime", "Courier New", Courier, monospace;
        font-size: 1rem;
        line-height: 1.25;
      }

      .script p {
        margin: 0 0 1.25em;
      }

      h1 {
        font-size: 1.75rem;
        line-height: 1.15;
        margin: 0 0 1rem;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.5rem 1.125rem;
        border-radius: 6px;
        background: var(--accent);
        color: var(--on-accent);
        font-family: system-ui, sans-serif;
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="script" aria-hidden="true">
        <p>INT. A PAGE THAT ISN'T HERE - DAY</p>
